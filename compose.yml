name: zhixu-knowledge
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_base"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    profiles: [app]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: live
      DB_URL: jdbc:postgresql://postgres:5432/knowledge_base
      DB_USER: knowledge
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      STORAGE_TYPE: local
      STORAGE_PATH: /app/files
      AI_BASE_URL: ${AI_BASE_URL:-https://ai-api.m2time.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-6.1-sol}
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-ollama}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.55}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./backend/data/files:/app/files
      - ./backend/data/config:/app/data/config
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres-data:
